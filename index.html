<!DOCTYPE html>
<html lang="ko">
<head> 
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>MiniGram</title>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-2: #f5f5f5;
      --text: #111111;
      --muted: #737373;
      --line: #dbdbdb;
      --accent: #0095f6;
      --danger: #ed4956;
      --shadow: 0 8px 30px rgba(0,0,0,.06);
    }

    [data-theme="dark"] {
      --bg: #000000;
      --surface: #121212;
      --surface-2: #1c1c1c;
      --text: #f5f5f5;
      --muted: #a8a8a8;
      --line: #2b2b2b;
      --accent: #4cb5f9;
      --danger: #ff6670;
      --shadow: 0 10px 35px rgba(0,0,0,.38);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: background .2s ease, color .2s ease;
    }

    button, input { font: inherit; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(14px);
    }

    .topbar-inner {
      width: min(920px, calc(100% - 28px));
      height: 64px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      margin: 0;
      font-size: 25px;
      letter-spacing: -1.3px;
      font-weight: 800;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn, .text-btn, .primary-btn {
      border: 0;
      cursor: pointer;
      border-radius: 9px;
      transition: transform .1s ease, opacity .15s ease, background .15s ease;
    }

    .icon-btn:active, .text-btn:active, .primary-btn:active { transform: scale(.98); }

    .icon-btn {
      width: 40px;
      height: 40px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 18px;
    }

    .text-btn {
      padding: 9px 12px;
      background: transparent;
      color: var(--text);
      font-weight: 650;
    }

    .primary-btn {
      padding: 10px 14px;
      background: var(--accent);
      color: white;
      font-weight: 750;
    }

    .primary-btn:disabled, .text-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .layout {
      width: min(920px, calc(100% - 28px));
      margin: 28px auto 60px;
      display: grid;
      grid-template-columns: minmax(0, 600px) 280px;
      gap: 28px;
      align-items: start;
    }

    .feed { min-width: 0; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .composer {
      padding: 16px;
      margin-bottom: 18px;
    }

    .composer-row {
      display: flex;
      gap: 11px;
      align-items: center;
    }

    .avatar {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      background:
        linear-gradient(var(--surface), var(--surface)) padding-box,
        linear-gradient(135deg, #feda75, #d62976, #4f5bd5) border-box;
      border: 3px solid transparent;
    }

    .avatar > span {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
    }

    .composer-input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 22px;
      padding: 11px 14px;
      outline: none;
    }

    .composer-input:focus {
      border-color: var(--muted);
    }

    .guest-name-input,
    .guest-password-input {
      width: 120px;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 22px;
      padding: 11px 14px;
      outline: none;
    }

    .guest-name-input:focus,
    .guest-password-input:focus { border-color: var(--muted); }

    .feed-card { margin-bottom: 18px; }

    .post-head {
      min-height: 62px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .post-head .avatar {
      width: 38px;
      height: 38px;
    }

    .who { min-width: 0; flex: 1; }
    .username {
      font-size: 14px;
      font-weight: 750;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .time {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
    }

    .post-image-wrap {
      width: 100%;
      background: var(--surface-2);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .post-image {
      display: block;
      width: 100%;
      max-height: 620px;
      object-fit: cover;
      background: var(--surface-2);
    }

    .image-picker-row {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .image-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 9px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      background: var(--surface-2);
    }

    .image-label input { display: none; }

    .image-preview-wrap {
      margin-top: 12px;
      display: none;
      position: relative;
      width: min(260px, 100%);
    }

    .image-preview-wrap.show { display: block; }

    .image-preview {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--line);
    }

    .clear-image-btn {
      position: absolute;
      right: 7px;
      top: 7px;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      background: rgba(0,0,0,.7);
      color: #fff;
      font-weight: 800;
    }

    .post-body {
      padding: 14px 16px 18px;
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .post-actions {
      padding: 10px 14px 12px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .delete-btn, .edit-btn {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-weight: 650;
      padding: 4px;
    }

    .delete-btn { color: var(--danger); }
    .edit-btn { color: var(--accent); }

    .post-owner-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .guest-badge {
      display: inline-block;
      margin-left: 5px;
      padding: 2px 5px;
      border-radius: 5px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 10px;
      vertical-align: 1px;
    }

    .comments {
      border-top: 1px solid var(--line);
      padding: 12px 14px 14px;
    }

    .comment-list {
      display: grid;
      gap: 10px;
      margin-bottom: 12px;
    }

    .comment-item {
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .comment-item strong { margin-right: 6px; }

    .comment-owner-actions {
      display: inline-flex;
      gap: 6px;
      margin-left: 8px;
    }

    .comment-edit-btn,
    .comment-delete-btn {
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      padding: 2px 3px;
      font-weight: 650;
    }

    .comment-edit-btn { color: var(--accent); }
    .comment-delete-btn { color: var(--danger); }
    .comment-time {
      color: var(--muted);
      font-size: 11px;
      margin-left: 6px;
    }

    .comment-form {
      display: flex;
      gap: 7px;
      align-items: center;
    }

    .comment-name {
      width: 90px;
      min-width: 90px;
    }

    .comment-input {
      flex: 1;
      min-width: 0;
    }

    .comment-name, .comment-password, .comment-input {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 18px;
      padding: 9px 11px;
      outline: none;
      font-size: 13px;
    }

    .comment-btn {
      border: 0;
      background: transparent;
      color: var(--accent);
      font-weight: 750;
      cursor: pointer;
      padding: 8px 4px;
    }

    .sidebar {
      position: sticky;
      top: 92px;
    }

    .profile-box {
      padding: 18px;
    }

    .profile-line {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-copy { min-width: 0; }
    .profile-copy strong, .profile-copy span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .profile-copy span {
      color: var(--muted);
      font-size: 13px;
      margin-top: 3px;
    }

    .status {
      min-height: 22px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .status.error { color: var(--danger); }

    .guest-box {
      padding: 20px;
      text-align: center;
    }

    .guest-box p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      margin: 6px 0 15px;
    }

    .empty {
      padding: 44px 20px;
      text-align: center;
      color: var(--muted);
    }

    .modal-wrap {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      background: rgba(0,0,0,.55);
      padding: 20px;
    }

    .modal-wrap.open { display: grid; }

    .modal {
      width: min(420px, 100%);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 25px 80px rgba(0,0,0,.35);
    }

    .modal h2 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    .modal .sub {
      color: var(--muted);
      margin: 0 0 20px;
      font-size: 14px;
      line-height: 1.5;
    }

    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 10px;
      padding: 12px 13px;
      outline: none;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    .modal-actions .primary-btn { flex: 1; }

    .switcher {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
      background: var(--surface-2);
      padding: 4px;
      border-radius: 10px;
    }

    .switcher button {
      flex: 1;
      border: 0;
      border-radius: 8px;
      padding: 9px;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
    }

    .switcher button.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 2px 9px rgba(0,0,0,.08);
    }

    .help {
      margin-top: 20px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
        width: min(600px, calc(100% - 20px));
        margin-top: 18px;
      }
      .sidebar { display: none; }
      .topbar-inner { width: min(600px, calc(100% - 20px)); }
    }

    @media (max-width: 480px) {
      .brand { font-size: 22px; }
      .card { border-left: 0; border-right: 0; border-radius: 0; }
      .layout { width: 100%; }
      .composer, .feed-card { margin-bottom: 10px; }
      .composer-row { align-items: stretch; flex-wrap: wrap; }
      .composer .avatar { display: none; }
      .guest-name-input, .guest-password-input { width: 100%; }
      .composer-input { flex-basis: calc(100% - 74px); }
      .comment-form { flex-wrap: wrap; }
      .comment-name { width: 100%; }
      .primary-btn { padding-left: 12px; padding-right: 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 class="brand">MiniGram</h1>
      <div class="actions">
        <button id="themeBtn" class="icon-btn" aria-label="다크모드 전환">🌙</button>
        <button id="authBtn" class="primary-btn">로그인</button>
        <button id="logoutBtn" class="text-btn" hidden>로그아웃</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="feed">
      <section id="composerCard" class="card composer">
        <div class="composer-row">
          <div class="avatar"><span id="composerAvatar">?</span></div>
          <input id="guestPostName" class="guest-name-input" maxlength="20"
                 placeholder="닉네임" />
          <input id="guestPostPassword" class="guest-password-input" type="password"
                 minlength="4" maxlength="50" placeholder="비밀번호" />
          <input id="postInput" class="composer-input" maxlength="500"
                 placeholder="로그인 없이도 글을 남길 수 있어요" />
          <button id="postBtn" class="primary-btn">게시</button>
        </div>
        <div class="image-picker-row">
          <label class="image-label">
            📷 사진 추가
            <input id="postImageInput" type="file" accept="image/*" />
          </label>
          <span class="hint" style="margin:0">이미지 1장 · 최대 5MB</span>
        </div>
        <div id="imagePreviewWrap" class="image-preview-wrap">
          <img id="imagePreview" class="image-preview" alt="업로드 미리보기" />
          <button id="clearImageBtn" class="clear-image-btn" type="button" aria-label="사진 선택 취소">×</button>
        </div>
        <p id="status" class="status"></p>
      </section>

      <section id="feedList"></section>
    </section>

    <aside class="sidebar">
      <section id="profilePanel" class="card profile-box" hidden>
        <div class="profile-line">
          <div class="avatar"><span id="sideAvatar">?</span></div>
          <div class="profile-copy">
            <strong id="sideUsername">사용자</strong>
            <span id="sideEmail"></span>
          </div>
        </div>
        <p class="help">로그인 글은 본인만 수정/삭제할 수 있고, 비로그인 글·댓글은 작성 비밀번호로 관리할 수 있어요.</p>
      </section>

      <section id="guestPanel" class="card guest-box">
        <strong>MiniGram에 오신 걸 환영해요</strong>
        <p>비로그인도 닉네임 + 비밀번호로 글과 댓글을 남기고, 같은 비밀번호로 수정/삭제할 수 있어요.</p>
        <button id="guestLoginBtn" class="primary-btn">시작하기</button>
      </section>
    </aside>
  </main>

  <div id="authModal" class="modal-wrap" role="dialog" aria-modal="true">
    <section class="modal">
      <div class="switcher">
        <button id="loginTab" class="active">로그인</button>
        <button id="signupTab">회원가입</button>
      </div>

      <h2 id="modalTitle">로그인</h2>
      <p id="modalSub" class="sub">이메일과 비밀번호로 로그인하세요.</p>

      <div id="usernameField" class="field" hidden>
        <label for="usernameInput">닉네임</label>
        <input id="usernameInput" maxlength="30" autocomplete="nickname" placeholder="예: minsu" />
      </div>

      <div class="field">
        <label for="emailInput">이메일</label>
        <input id="emailInput" type="email" autocomplete="email" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label for="passwordInput">비밀번호</label>
        <input id="passwordInput" type="password" minlength="6" autocomplete="current-password"
               placeholder="6자 이상" />
      </div>

      <p id="authStatus" class="status"></p>

      <div class="modal-actions">
        <button id="closeModalBtn" class="text-btn">취소</button>
        <button id="submitAuthBtn" class="primary-btn">로그인</button>
      </div>
    </section>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    // =========================================================
    // 여기에 본인의 Supabase 값만 넣으세요.
    // =========================================================
    const SUPABASE_URL = "https://dcpavjdfvrqwijvpejqy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_1XJ7OIZW4Kn7sbJhuTs-og_T_f0wSkD";
    // service_role / secret key는 절대 넣지 마세요.
    // =========================================================

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const els = {
      themeBtn: document.getElementById("themeBtn"),
      authBtn: document.getElementById("authBtn"),
      logoutBtn: document.getElementById("logoutBtn"),
      guestLoginBtn: document.getElementById("guestLoginBtn"),
      profilePanel: document.getElementById("profilePanel"),
      guestPanel: document.getElementById("guestPanel"),
      sideUsername: document.getElementById("sideUsername"),
      sideEmail: document.getElementById("sideEmail"),
      sideAvatar: document.getElementById("sideAvatar"),
      composerAvatar: document.getElementById("composerAvatar"),
      guestPostName: document.getElementById("guestPostName"),
      guestPostPassword: document.getElementById("guestPostPassword"),
      postInput: document.getElementById("postInput"),
      postBtn: document.getElementById("postBtn"),
      postImageInput: document.getElementById("postImageInput"),
      imagePreviewWrap: document.getElementById("imagePreviewWrap"),
      imagePreview: document.getElementById("imagePreview"),
      clearImageBtn: document.getElementById("clearImageBtn"),
      status: document.getElementById("status"),
      feedList: document.getElementById("feedList"),
      authModal: document.getElementById("authModal"),
      loginTab: document.getElementById("loginTab"),
      signupTab: document.getElementById("signupTab"),
      modalTitle: document.getElementById("modalTitle"),
      modalSub: document.getElementById("modalSub"),
      usernameField: document.getElementById("usernameField"),
      usernameInput: document.getElementById("usernameInput"),
      emailInput: document.getElementById("emailInput"),
      passwordInput: document.getElementById("passwordInput"),
      authStatus: document.getElementById("authStatus"),
      closeModalBtn: document.getElementById("closeModalBtn"),
      submitAuthBtn: document.getElementById("submitAuthBtn")
    };

    let currentUser = null;
    let currentProfile = null;
    let authMode = "login";

    function setStatus(message = "", isError = false) {
      els.status.textContent = message;
      els.status.className = isError ? "status error" : "status";
    }

    function setAuthStatus(message = "", isError = false) {
      els.authStatus.textContent = message;
      els.authStatus.className = isError ? "status error" : "status";
    }

    function initials(name) {
      const value = (name || "?").trim();
      return value ? value.slice(0, 1).toUpperCase() : "?";
    }

    function formatDate(value) {
      if (!value) return "";
      return new Date(value).toLocaleString("ko-KR", {
        month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"
      });
    }

    function escapeText(value) {
      return String(value ?? "");
    }

    // ---------- 다크모드 ----------
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      localStorage.setItem("minigram-theme", theme);
      els.themeBtn.textContent = theme === "dark" ? "☀️" : "🌙";
      els.themeBtn.setAttribute("aria-label", theme === "dark" ? "라이트모드 전환" : "다크모드 전환");
    }

    const savedTheme = localStorage.getItem("minigram-theme");
    const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    applyTheme(savedTheme || (prefersDark ? "dark" : "light"));

    els.themeBtn.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      applyTheme(next);
    });

    // ---------- 로그인 모달 ----------
    function setAuthMode(mode) {
      authMode = mode;
      const signup = mode === "signup";
      els.loginTab.classList.toggle("active", !signup);
      els.signupTab.classList.toggle("active", signup);
      els.usernameField.hidden = !signup;
      els.modalTitle.textContent = signup ? "회원가입" : "로그인";
      els.modalSub.textContent = signup
        ? "닉네임, 이메일, 비밀번호로 새 계정을 만드세요."
        : "이메일과 비밀번호로 로그인하세요.";
      els.submitAuthBtn.textContent = signup ? "계정 만들기" : "로그인";
      els.passwordInput.autocomplete = signup ? "new-password" : "current-password";
      setAuthStatus();
    }

    function openAuth(mode = "login") {
      setAuthMode(mode);
      els.authModal.classList.add("open");
      setTimeout(() => (mode === "signup" ? els.usernameInput : els.emailInput).focus(), 0);
    }

    function closeAuth() {
      els.authModal.classList.remove("open");
      setAuthStatus();
    }

    els.authBtn.addEventListener("click", () => openAuth("login"));
    els.guestLoginBtn.addEventListener("click", () => openAuth("signup"));
    els.closeModalBtn.addEventListener("click", closeAuth);
    els.loginTab.addEventListener("click", () => setAuthMode("login"));
    els.signupTab.addEventListener("click", () => setAuthMode("signup"));
    els.authModal.addEventListener("click", (e) => {
      if (e.target === els.authModal) closeAuth();
    });

    async function submitAuth() {
      const email = els.emailInput.value.trim();
      const password = els.passwordInput.value;
      const username = els.usernameInput.value.trim();

      if (!email || !password) {
        setAuthStatus("이메일과 비밀번호를 입력하세요.", true);
        return;
      }

      if (password.length < 6) {
        setAuthStatus("비밀번호는 6자 이상으로 입력하세요.", true);
        return;
      }

      els.submitAuthBtn.disabled = true;

      if (authMode === "signup") {
        if (username.length < 2) {
          setAuthStatus("닉네임은 2자 이상 입력하세요.", true);
          els.submitAuthBtn.disabled = false;
          return;
        }

        setAuthStatus("계정을 만드는 중...");

        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: { username }
          }
        });

        els.submitAuthBtn.disabled = false;

        if (error) {
          setAuthStatus(error.message, true);
          return;
        }

        // 프로젝트에서 이메일 확인이 켜져 있으면 session이 바로 생기지 않을 수 있음.
        if (!data.session) {
          setAuthStatus("가입 완료! 이메일 확인이 켜져 있다면 받은 메일에서 인증 후 로그인하세요.");
          return;
        }

        closeAuth();
        return;
      }

      setAuthStatus("로그인 중...");

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      els.submitAuthBtn.disabled = false;

      if (error) {
        setAuthStatus(error.message, true);
        return;
      }

      closeAuth();
    }

    els.submitAuthBtn.addEventListener("click", submitAuth);
    els.passwordInput.addEventListener("keydown", e => {
      if (e.key === "Enter") submitAuth();
    });

    els.logoutBtn.addEventListener("click", async () => {
      await supabase.auth.signOut();
    });

    // ---------- 프로필 / 세션 ----------
    async function loadMyProfile() {
      if (!currentUser) {
        currentProfile = null;
        return;
      }

      const { data, error } = await supabase
        .from("profiles")
        .select("id, username")
        .eq("id", currentUser.id)
        .single();

      if (error) {
        console.error(error);
        currentProfile = {
          id: currentUser.id,
          username: currentUser.user_metadata?.username || "user"
        };
        return;
      }

      currentProfile = data;
    }

    function renderSession() {
      const loggedIn = Boolean(currentUser);
      els.authBtn.hidden = loggedIn;
      els.logoutBtn.hidden = !loggedIn;
      els.profilePanel.hidden = !loggedIn;
      els.guestPanel.hidden = loggedIn;

      els.postInput.disabled = false;
      els.postBtn.disabled = false;
      els.guestPostName.hidden = loggedIn;
      els.guestPostPassword.hidden = loggedIn;
      els.postInput.placeholder = loggedIn
        ? "무슨 생각을 하고 있나요?"
        : "로그인 없이도 글을 남길 수 있어요";

      if (loggedIn) {
        const name = currentProfile?.username || currentUser.user_metadata?.username || "user";
        els.sideUsername.textContent = name;
        els.sideEmail.textContent = currentUser.email || "";
        els.sideAvatar.textContent = initials(name);
        els.composerAvatar.textContent = initials(name);
      } else {
        els.composerAvatar.textContent = "?";
      }
    }

    // ---------- 사진 업로드 ----------
    const MAX_IMAGE_BYTES = 5 * 1024 * 1024;
    let selectedPostImage = null;
    let previewObjectUrl = null;

    function clearSelectedImage() {
      selectedPostImage = null;
      els.postImageInput.value = "";

      if (previewObjectUrl) {
        URL.revokeObjectURL(previewObjectUrl);
        previewObjectUrl = null;
      }

      els.imagePreview.removeAttribute("src");
      els.imagePreviewWrap.classList.remove("show");
    }

    els.postImageInput.addEventListener("change", () => {
      const file = els.postImageInput.files?.[0] || null;

      if (!file) {
        clearSelectedImage();
        return;
      }

      if (!file.type.startsWith("image/")) {
        setStatus("이미지 파일만 업로드할 수 있습니다.", true);
        clearSelectedImage();
        return;
      }

      if (file.size > MAX_IMAGE_BYTES) {
        setStatus("사진은 5MB 이하만 업로드할 수 있습니다.", true);
        clearSelectedImage();
        return;
      }

      selectedPostImage = file;

      if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
      previewObjectUrl = URL.createObjectURL(file);
      els.imagePreview.src = previewObjectUrl;
      els.imagePreviewWrap.classList.add("show");
      setStatus();
    });

    els.clearImageBtn.addEventListener("click", clearSelectedImage);

    function safeFileExtension(file) {
      const raw = file.name.split(".").pop()?.toLowerCase() || "";
      const allowed = ["jpg", "jpeg", "png", "webp", "gif"];
      if (allowed.includes(raw)) return raw;

      const byMime = {
        "image/jpeg": "jpg",
        "image/png": "png",
        "image/webp": "webp",
        "image/gif": "gif"
      };

      return byMime[file.type] || "jpg";
    }

    async function uploadPostImage(file) {
      if (!file) return null;

      const ext = safeFileExtension(file);
      const folder = currentUser ? `users/${currentUser.id}` : "guests";
      const filename =
        `${Date.now()}-${crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)}.${ext}`;
      const path = `${folder}/${filename}`;

      const { error: uploadError } = await supabase.storage
        .from("post-images")
        .upload(path, file, {
          cacheControl: "3600",
          upsert: false,
          contentType: file.type
        });

      if (uploadError) throw uploadError;

      const { data } = supabase.storage
        .from("post-images")
        .getPublicUrl(path);

      return data.publicUrl;
    }

    // ---------- 글 작성 ----------
    async function createPost() {
      const content = els.postInput.value.trim();
      const guestName = els.guestPostName.value.trim();
      const guestPassword = els.guestPostPassword.value;

      if (!content && !selectedPostImage) {
        setStatus("글 내용이나 사진 중 하나는 있어야 합니다.", true);
        els.postInput.focus();
        return;
      }

      if (!currentUser && guestName.length < 2) {
        setStatus("비로그인 글은 닉네임을 2자 이상 입력하세요.", true);
        els.guestPostName.focus();
        return;
      }

      if (!currentUser && guestPassword.length < 4) {
        setStatus("비로그인 글 비밀번호는 4자 이상 입력하세요.", true);
        els.guestPostPassword.focus();
        return;
      }

      els.postBtn.disabled = true;
      setStatus(selectedPostImage ? "사진 업로드 중..." : "게시 중...");

      let imageUrl = null;

      try {
        if (selectedPostImage) {
          imageUrl = await uploadPostImage(selectedPostImage);
        }
      } catch (e) {
        console.error(e);
        els.postBtn.disabled = false;
        setStatus("사진 업로드 오류: " + (e.message || "업로드에 실패했습니다."), true);
        return;
      }

      setStatus("게시 중...");
      let error = null;

      if (currentUser) {
        const result = await supabase
          .from("posts")
          .insert({
            user_id: currentUser.id,
            guest_name: null,
            content: content || "",
            image_url: imageUrl
          });
        error = result.error;
      } else {
        const result = await supabase.rpc("create_guest_post", {
          p_guest_name: guestName,
          p_password: guestPassword,
          p_content: content || "",
          p_image_url: imageUrl
        });
        error = result.error;
      }

      els.postBtn.disabled = false;

      if (error) {
        console.error(error);
        setStatus("게시 오류: " + error.message, true);
        return;
      }

      els.postInput.value = "";
      if (!currentUser) {
        els.guestPostName.value = "";
        els.guestPostPassword.value = "";
      }
      clearSelectedImage();
      setStatus("게시했습니다.");
      await loadFeed();
    }

    els.postBtn.addEventListener("click", createPost);
    els.postInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        createPost();
      }
    });

    async function editPost(id, oldContent, isGuest = false) {
      const content = prompt("글을 수정하세요.", oldContent);
      if (content === null) return;

      const trimmed = content.trim();
      if (!trimmed) {
        setStatus("글 내용은 비워둘 수 없습니다.", true);
        return;
      }

      let error = null;

      if (isGuest) {
        const password = prompt("작성할 때 입력한 비밀번호를 입력하세요.");
        if (password === null) return;

        const result = await supabase.rpc("update_guest_post", {
          p_post_id: id,
          p_password: password,
          p_content: trimmed
        });

        error = result.error;
        if (!error && result.data !== true) {
          setStatus("비밀번호가 맞지 않거나 수정할 수 없는 글입니다.", true);
          return;
        }
      } else {
        if (!currentUser) return;

        const result = await supabase
          .from("posts")
          .update({ content: trimmed })
          .eq("id", id);
        error = result.error;
      }

      if (error) {
        console.error(error);
        setStatus("수정 오류: " + error.message, true);
        return;
      }

      setStatus("글을 수정했습니다.");
      await loadFeed();
    }

    async function deletePost(id, isGuest = false) {
      if (!confirm("이 글을 삭제할까요?")) return;

      let error = null;

      if (isGuest) {
        const password = prompt("작성할 때 입력한 비밀번호를 입력하세요.");
        if (password === null) return;

        const result = await supabase.rpc("delete_guest_post", {
          p_post_id: id,
          p_password: password
        });

        error = result.error;
        if (!error && result.data !== true) {
          setStatus("비밀번호가 맞지 않거나 삭제할 수 없는 글입니다.", true);
          return;
        }
      } else {
        if (!currentUser) return;

        const result = await supabase
          .from("posts")
          .delete()
          .eq("id", id);
        error = result.error;
      }

      if (error) {
        console.error(error);
        setStatus("삭제 오류: " + error.message, true);
        return;
      }

      setStatus("삭제했습니다.");
      await loadFeed();
    }

    async function editComment(id, oldContent, isGuest = false) {
      const content = prompt("댓글을 수정하세요.", oldContent);
      if (content === null) return;

      const trimmed = content.trim();
      if (!trimmed) {
        alert("댓글 내용은 비워둘 수 없습니다.");
        return;
      }

      let error = null;

      if (isGuest) {
        const password = prompt("댓글 작성 시 입력한 비밀번호를 입력하세요.");
        if (password === null) return;

        const result = await supabase.rpc("update_guest_comment", {
          p_comment_id: id,
          p_password: password,
          p_content: trimmed
        });

        error = result.error;
        if (!error && result.data !== true) {
          alert("비밀번호가 맞지 않거나 수정할 수 없는 댓글입니다.");
          return;
        }
      } else {
        if (!currentUser) return;

        const result = await supabase
          .from("comments")
          .update({ content: trimmed })
          .eq("id", id);
        error = result.error;
      }

      if (error) {
        console.error(error);
        alert("댓글 수정 오류: " + error.message);
        return;
      }

      await loadFeed();
    }

    async function deleteComment(id, isGuest = false) {
      if (!confirm("이 댓글을 삭제할까요?")) return;

      let error = null;

      if (isGuest) {
        const password = prompt("댓글 작성 시 입력한 비밀번호를 입력하세요.");
        if (password === null) return;

        const result = await supabase.rpc("delete_guest_comment", {
          p_comment_id: id,
          p_password: password
        });

        error = result.error;
        if (!error && result.data !== true) {
          alert("비밀번호가 맞지 않거나 삭제할 수 없는 댓글입니다.");
          return;
        }
      } else {
        if (!currentUser) return;

        const result = await supabase
          .from("comments")
          .delete()
          .eq("id", id);
        error = result.error;
      }

      if (error) {
        console.error(error);
        alert("댓글 삭제 오류: " + error.message);
        return;
      }

      await loadFeed();
    }

    async function createComment(postId, input, nameInput, passwordInput) {
      const content = input.value.trim();
      const guestName = nameInput?.value.trim() || "";
      const guestPassword = passwordInput?.value || "";

      if (!content) return;

      if (!currentUser && guestName.length < 2) {
        alert("비로그인 댓글은 닉네임을 2자 이상 입력하세요.");
        nameInput?.focus();
        return;
      }

      if (!currentUser && guestPassword.length < 4) {
        alert("비로그인 댓글 비밀번호는 4자 이상 입력하세요.");
        passwordInput?.focus();
        return;
      }

      let error = null;

      if (currentUser) {
        const result = await supabase
          .from("comments")
          .insert({
            post_id: postId,
            user_id: currentUser.id,
            guest_name: null,
            content
          });
        error = result.error;
      } else {
        const result = await supabase.rpc("create_guest_comment", {
          p_post_id: postId,
          p_guest_name: guestName,
          p_password: guestPassword,
          p_content: content
        });
        error = result.error;
      }

      if (error) {
        console.error(error);
        alert("댓글 오류: " + error.message);
        return;
      }

      input.value = "";
      if (nameInput) nameInput.value = "";
      if (passwordInput) passwordInput.value = "";
      await loadFeed();
    }

    // ---------- 피드 ----------
    async function loadFeed() {
      els.feedList.innerHTML = '<div class="card empty">피드를 불러오는 중...</div>';

      const { data, error } = await supabase
        .from("posts")
        .select(`
          id,
          content,
          image_url,
          created_at,
          user_id,
          guest_name,
          profiles (
            username
          ),
          comments (
            id,
            content,
            created_at,
            user_id,
            guest_name,
            profiles (
              username
            )
          )
        `)
        .order("created_at", { ascending: false })
        .limit(100);

      if (error) {
        console.error(error);
        els.feedList.innerHTML =
          `<div class="card empty">피드 오류<br>${error.message}</div>`;
        return;
      }

      if (!data || data.length === 0) {
        els.feedList.innerHTML =
          '<div class="card empty">아직 글이 없어요.<br>첫 번째 글을 남겨보세요.</div>';
        return;
      }

      els.feedList.innerHTML = "";

      for (const post of data) {
        const isGuestPost = !post.user_id;
        const username = isGuestPost
          ? (post.guest_name || "익명")
          : (post.profiles?.username || "user");
        const mine = Boolean(currentUser && post.user_id === currentUser.id);

        const article = document.createElement("article");
        article.className = "card feed-card";

        const head = document.createElement("div");
        head.className = "post-head";

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        const avatarInner = document.createElement("span");
        avatarInner.textContent = initials(username);
        avatar.appendChild(avatarInner);

        const who = document.createElement("div");
        who.className = "who";

        const name = document.createElement("div");
        name.className = "username";
        name.textContent = username;
        if (isGuestPost) {
          const badge = document.createElement("span");
          badge.className = "guest-badge";
          badge.textContent = "guest";
          name.appendChild(badge);
        }

        const time = document.createElement("div");
        time.className = "time";
        time.textContent = formatDate(post.created_at);

        who.append(name, time);
        head.append(avatar, who);

        let imageWrap = null;
        if (post.image_url) {
          imageWrap = document.createElement("div");
          imageWrap.className = "post-image-wrap";

          const image = document.createElement("img");
          image.className = "post-image";
          image.src = post.image_url;
          image.alt = `${username}님의 게시물 사진`;
          image.loading = "lazy";

          imageWrap.appendChild(image);
        }

        const body = document.createElement("div");
        body.className = "post-body";
        body.textContent = escapeText(post.content);
        if (!post.content) body.hidden = true;

        const actions = document.createElement("div");
        actions.className = "post-actions";

        const label = document.createElement("span");
        const commentCount = Array.isArray(post.comments) ? post.comments.length : 0;
        label.textContent = `댓글 ${commentCount}개`;
        actions.appendChild(label);

        if (mine || isGuestPost) {
          const ownerActions = document.createElement("div");
          ownerActions.className = "post-owner-actions";

          const edit = document.createElement("button");
          edit.className = "edit-btn";
          edit.textContent = "수정";
          edit.addEventListener("click", () => editPost(post.id, post.content, isGuestPost));

          const del = document.createElement("button");
          del.className = "delete-btn";
          del.textContent = "삭제";
          del.addEventListener("click", () => deletePost(post.id, isGuestPost));

          ownerActions.append(edit, del);
          actions.appendChild(ownerActions);
        }

        const commentsBox = document.createElement("div");
        commentsBox.className = "comments";

        const commentList = document.createElement("div");
        commentList.className = "comment-list";

        const comments = Array.isArray(post.comments)
          ? [...post.comments].sort((a, b) => new Date(a.created_at) - new Date(b.created_at))
          : [];

        for (const comment of comments) {
          const row = document.createElement("div");
          row.className = "comment-item";

          const cUser = comment.user_id
            ? (comment.profiles?.username || "user")
            : (comment.guest_name || "익명");

          const strong = document.createElement("strong");
          strong.textContent = cUser;

          const text = document.createElement("span");
          text.textContent = comment.content;

          const cTime = document.createElement("span");
          cTime.className = "comment-time";
          cTime.textContent = formatDate(comment.created_at);

          row.append(strong, text, cTime);

          const isGuestComment = !comment.user_id;
          const mineComment = Boolean(currentUser && comment.user_id === currentUser.id);

          if (isGuestComment || mineComment) {
            const cActions = document.createElement("span");
            cActions.className = "comment-owner-actions";

            const cEdit = document.createElement("button");
            cEdit.className = "comment-edit-btn";
            cEdit.textContent = "수정";
            cEdit.addEventListener("click", () =>
              editComment(comment.id, comment.content, isGuestComment)
            );

            const cDelete = document.createElement("button");
            cDelete.className = "comment-delete-btn";
            cDelete.textContent = "삭제";
            cDelete.addEventListener("click", () =>
              deleteComment(comment.id, isGuestComment)
            );

            cActions.append(cEdit, cDelete);
            row.appendChild(cActions);
          }

          commentList.appendChild(row);
        }

        const form = document.createElement("div");
        form.className = "comment-form";

        let commentNameInput = null;
        let commentPasswordInput = null;
        if (!currentUser) {
          commentNameInput = document.createElement("input");
          commentNameInput.className = "comment-name";
          commentNameInput.maxLength = 20;
          commentNameInput.placeholder = "닉네임";

          commentPasswordInput = document.createElement("input");
          commentPasswordInput.className = "comment-password";
          commentPasswordInput.type = "password";
          commentPasswordInput.minLength = 4;
          commentPasswordInput.maxLength = 50;
          commentPasswordInput.placeholder = "비밀번호";

          form.append(commentNameInput, commentPasswordInput);
        }

        const commentInput = document.createElement("input");
        commentInput.className = "comment-input";
        commentInput.maxLength = 300;
        commentInput.placeholder = currentUser
          ? "댓글 달기..."
          : "비로그인 댓글 달기...";

        const commentBtn = document.createElement("button");
        commentBtn.className = "comment-btn";
        commentBtn.textContent = "게시";

        const submitComment = () =>
          createComment(post.id, commentInput, commentNameInput, commentPasswordInput);
        commentBtn.addEventListener("click", submitComment);
        commentInput.addEventListener("keydown", e => {
          if (e.key === "Enter") submitComment();
        });

        form.append(commentInput, commentBtn);
        commentsBox.append(commentList, form);

        article.append(head, body, actions, commentsBox);
        els.feedList.appendChild(article);
      }
    }

    async function refreshSession(session) {
      currentUser = session?.user || null;
      await loadMyProfile();
      renderSession();
      await loadFeed();
    }

    const { data: sessionData } = await supabase.auth.getSession();
    await refreshSession(sessionData.session);

    supabase.auth.onAuthStateChange(async (_event, session) => {
      // Supabase auth 콜백 내부에서 후속 네트워크 요청을 너무 많이 엮지 않도록
      // 다음 틱에서 갱신.
      setTimeout(() => refreshSession(session), 0);
    });
  </script>
